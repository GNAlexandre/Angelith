# SonarQube Cloud — paramètres du scan lancé par la CI (`.github/workflows/ci.yml`, job
# `sonar`). Les trois premières valeurs viennent de `.sonarlint/connectedMode.json`, qui est
# la source de vérité pour le mode connecté de l'IDE : les faire diverger reviendrait à
# analyser deux projets différents selon qu'on lit le code dans l'éditeur ou en CI.

sonar.projectKey=GNAlexandre_Yume-Trad
sonar.organization=gnalexandre

# ⚠ PIÈGE DE NOMMAGE, et il faut le nommer parce qu'il est à un caractère près : le dépôt
# possède un dossier `sources/` qui contient les ŒUVRES À TRADUIRE. Il n'a RIEN à voir avec
# `sonar.sources`, et il doit être exclu — comme `build/`, qui contient les tomes produits.
#
# C'est pour cette collision que les paquets sont énumérés plutôt qu'écrits `sonar.sources=.`
# Contrepartie assumée : un futur paquet de premier niveau devra être ajouté ici à la main,
# et `CONTRIBUTING.md` le dit.
sonar.sources=core,pipeline,manga,scan,gui,tools,app.py,gui.py,run.py,run_manga.py,run_ocr.py
sonar.tests=tests

sonar.python.version=3.12

# ⚠ DEUX rapports, et c'est le point qui compte. Le job `tests` exclut délibérément les
# marqueurs `lent` et `modeles` : ils exigent les poids ONNX que le dépôt ne commite pas. Si
# Sonar ne recevait que ce rapport-là, la couverture publiée exclurait toute la détection de
# bulles et l'OCR — c'est-à-dire précisément le code le plus cher et le plus risqué — tout en
# s'affichant comme « la » couverture du projet. Le second rapport vient du job `banc`, qui
# exécute justement ce que le premier écarte.
sonar.python.coverage.reportPaths=coverage.xml,coverage-banc.xml

# Même liste que `ruff.toml > exclude`, plus `templates/` (des gabarits `.docx`/`.css`, pas du
# code). Rester cohérent entre les deux outils évite qu'un fichier soit linté sans être
# analysé, ou l'inverse.
sonar.exclusions=build/**,sources/**,manga_models/**,templates/**,**/__pycache__/**
