[pytest]
# Le dépôt n'avait aucun fichier de configuration pytest : impossible d'écarter proprement
# les tests coûteux, donc impossible de lancer « la suite » sur une machine secondaire sans
# y passer un quart d'heure.
#
# ⚠ Les marqueurs ne servent PAS à cacher un test qui pend. Quand un fichier ne se terminait
# pas, la cause était un vrai défaut — la passe `sfx` chargeait le détecteur de texte et
# payait 110 s d'inférence ONNX par planche dans des tests qui ne mesuraient que des
# statistiques d'appels LLM (564 s → 2,25 s une fois désactivée). Marquer aurait masqué ça.
# Ce qui reste ici est ce qui est LÉGITIMEMENT cher : de la vision par ordinateur réelle.

testpaths = tests

markers =
    modeles: exige les poids sous manga_models/ (détecteur de bulles, détecteur de texte) — de la vraie inférence, donc lent par nature
    lent: dépasse ~30 s sur une machine de bureau ; mesuré, pas estimé
    llm: exige un serveur LLM joignable (aucun test n'en dépend aujourd'hui — les clients sont doublés)
